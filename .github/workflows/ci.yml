name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Real provider and external client smoke must refuse CI execution
        run: pnpm test:smoke-guards

      - name: API typecheck (including tests and Drizzle configuration)
        run: pnpm --filter specbridge-api typecheck

      - name: Web typecheck (including browser tests)
        run: pnpm --filter web typecheck

      - name: MCP typecheck (including client tests)
        run: pnpm --filter specbridge-mcp typecheck

      - name: API route regression
        run: pnpm --filter specbridge-api test:e2e

      - name: OpenAPI and generated Web type drift
        run: pnpm --filter specbridge-api openapi:check

      - name: Migration metadata check
        run: pnpm --filter specbridge-api db:check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: specbridge_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: specbridge_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U specbridge_test -d specbridge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://specbridge_test:local_test_only@127.0.0.1:5434/specbridge_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Apply only committed, human-reviewed SQL; never generate/push schema in CI.
      - name: PostgreSQL migrations and integration tests
        run: pnpm --filter specbridge-api test:integration

      - name: Authentication HTTP and compiled Web proxy E2E
        run: pnpm --filter specbridge-api test:e2e:auth

      - name: Workspace and Project RBAC HTTP and proxy E2E
        run: pnpm --filter specbridge-api test:e2e:rbac

      - name: Requirement revision HTTP and proxy E2E
        run: pnpm --filter specbridge-api test:e2e:requirements

      - name: ChangeRequest approval HTTP and proxy E2E
        run: pnpm --filter specbridge-api test:e2e:changes

      - name: Delivery acceptance HTTP and proxy E2E
        run: pnpm --filter specbridge-api test:e2e:deliveries

      - name: R07 reads and HTTP schema contracts
        run: pnpm --filter specbridge-api test:e2e:reads

      - name: R08 analysis and Copilot HTTP permission checks (mock provider, no API key)
        run: pnpm --filter specbridge-api test:e2e:ai

      - name: Project API token authorization and transactions
        run: pnpm --filter specbridge-api test:e2e:tokens

      - name: Real stdio MCP Client to authorized API and PostgreSQL
        run: pnpm --filter specbridge-api test:e2e:mcp

      - name: Install Chromium and system dependencies
        run: pnpm --filter web exec playwright install --with-deps --only-shell chromium

      - name: Build production Web for browser acceptance
        run: pnpm --filter web build

      - name: R01–R08 browser regression, AI/Copilot mocks and token lifecycle
        run: |
          cp .env.test.example .env.test
          pnpm run test:browser:run
