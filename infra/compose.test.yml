name: specbridge-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: specbridge_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: specbridge_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./test-init.sql:/docker-entrypoint-initdb.d/01-test-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specbridge_test -d specbridge_test"]
      interval: 2s
      timeout: 3s
      retries: 15
